<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>

    <style>
       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", "Poppins", Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;

    background:
        radial-gradient(circle at 15% 20%, #7c3aed 0%, transparent 25%),
        radial-gradient(circle at 85% 80%, #06b6d4 0%, transparent 25%),
        radial-gradient(circle at 80% 15%, #ec4899 0%, transparent 20%),
        #050816;
}

/* Background effect */

body::before {
    content: "";
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: #7c3aed;
    filter: blur(150px);
    opacity: .25;
    top: -200px;
    left: -150px;
    animation: move 8s ease-in-out infinite alternate;
}

body::after {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: #06b6d4;
    filter: blur(150px);
    opacity: .2;
    bottom: -180px;
    right: -120px;
    animation: move2 10s ease-in-out infinite alternate;
}

@keyframes move {
    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(100px, 80px);
    }
}

@keyframes move2 {
    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(-80px, -70px);
    }
}


/* FORM */

form {
    position: relative;
    z-index: 2;

    width: 430px;
    padding: 45px 40px;

    border-radius: 28px;

    background: rgba(255, 255, 255, .075);

    border: 1px solid rgba(255, 255, 255, .15);

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    box-shadow:
        0 35px 100px rgba(0, 0, 0, .55),
        inset 0 1px 1px rgba(255, 255, 255, .12);

    animation: show .7s cubic-bezier(.16, 1, .3, 1);
}

@keyframes show {
    from {
        opacity: 0;
        transform: translateY(50px) scale(.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* TITLE */

#title {
    text-align: center;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 8px;

    background: linear-gradient(
        90deg,
        #a78bfa,
        #22d3ee,
        #f472b6
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

#description {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 25px;
}


/* INPUT */

.input-box {
    position: relative;
    margin-bottom: 15px;
}

input {
    width: 100%;
    height: 56px;

    padding: 0 18px;

    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 15px;

    outline: none;

    background: rgba(2, 6, 23, .55);

    color: white;

    font-size: 14px;

    transition: .3s ease;
}

input::placeholder {
    color: #64748b;
}

input:hover {
    border-color: rgba(167, 139, 250, .5);
}

input:focus {
    border-color: #8b5cf6;

    background: rgba(2, 6, 23, .8);

    box-shadow:
        0 0 0 4px rgba(124, 58, 237, .12),
        0 10px 30px rgba(0, 0, 0, .2);

    transform: translateY(-1px);
}


/* PASSWORD */

.password-box input {
    padding-right: 80px;
}

#togglePassword {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);

    border: none;
    background: none;

    color: #a78bfa;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;

    transition: .3s;
}

#togglePassword:hover {
    color: #22d3ee;
}


/* BUTTON */

#button {
    position: relative;

    width: 100%;
    height: 56px;

    margin-top: 5px;

    border: none;
    border-radius: 15px;

    background:
        linear-gradient(
            110deg,
            #7c3aed,
            #6366f1,
            #06b6d4,
            #ec4899
        );

    background-size: 300% 100%;

    color: white;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 12px 35px rgba(124, 58, 237, .4);

    transition: .4s ease;

    animation: gradient 5s ease infinite;
}

@keyframes gradient {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

#button:hover {
    transform: translateY(-3px) scale(1.01);

    box-shadow:
        0 18px 45px rgba(124, 58, 237, .55);
}

#button:active {
    transform: scale(.98);
}


/* MESSAGE */

#message {
    min-height: 20px;

    margin-top: 12px;

    text-align: center;

    font-size: 13px;
    font-weight: 600;
}


/* BOTTOM */

#bottomText {
    margin-top: 12px;

    text-align: center;

    color: #64748b;

    font-size: 13px;
}

#hisob {
    color: #a78bfa;

    font-weight: 700;

    cursor: pointer;

    transition: .3s;
}

#hisob:hover {
    color: #22d3ee;

    text-shadow:
        0 0 15px rgba(34, 211, 238, .7);
}


/* MOBILE */

@media (max-width: 500px) {

    body {
        padding: 15px;
    }

    form {
        width: 100%;
        padding: 35px 22px;
        border-radius: 24px;
    }

    #title {
        font-size: 32px;
    }

    input,
    #button {
        height: 54px;
    }
}
    </style>
</head>

<body>

    <form id="authForm">

        <h1 id="title">Register</h1>

        <p id="description">
            Yangi hisob yaratish uchun ma'lumotlaringizni kiriting
        </p>

        <div class="input-box" id="nameBox">
            <input
                type="text"
                id="name"
                placeholder="Ismingizni kiriting"
                autocomplete="name"
            >
        </div>

        <div class="input-box">
            <input
                type="email"
                id="email"
                placeholder="Emailingizni kiriting"
                autocomplete="email"
            >
        </div>

        <div class="input-box password-box">
            <input
                type="password"
                id="password"
                placeholder="Parolingizni kiriting"
                autocomplete="current-password"
            >

            <button
                type="button"
                id="togglePassword"
                onclick="togglePassword()"
            >
                Ko‘rsat
            </button>
        </div>

        <button
            type="button"
            id="button"
            onclick="register()"
        >
            Register
        </button>

        <p id="message"></p>

        <p id="bottomText">
            Hisobingiz allaqachon mavjudmi?
            <span id="hisob" onclick="showLogin()">
                Login qiling
            </span>
        </p>

    </form>


    <script>

        // Elementlarni olish

        const title = document.getElementById("title");
        const description = document.getElementById("description");
        const nameBox = document.getElementById("nameBox");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const button = document.getElementById("button");
        const message = document.getElementById("message");
        const bottomText = document.getElementById("bottomText");
        const toggleBtn = document.getElementById("togglePassword");


        // Xabarni tozalash

        function clearMessage() {
            message.textContent = "";
            message.style.color = "";
        }


        // Login oynasiga o'tish

        function showLogin() {

            title.textContent = "Login";

            description.textContent =
                "Hisobingizga kirish uchun ma'lumotlaringizni kiriting";

            nameBox.style.display = "none";

            button.textContent = "Login";
            button.onclick = login;

            bottomText.innerHTML =
                `Hisobingiz yo'qmi?
                <span id="hisob" onclick="showRegister()">
                    Yangi hisob yarating
                </span>`;

            clearMessage();

            passwordInput.value = "";
        }


        // Register oynasiga o'tish

        function showRegister() {

            title.textContent = "Register";

            description.textContent =
                "Yangi hisob yaratish uchun ma'lumotlaringizni kiriting";

            nameBox.style.display = "block";

            button.textContent = "Register";
            button.onclick = register;

            bottomText.innerHTML =
                `Hisobingiz allaqachon mavjudmi?
                <span id="hisob" onclick="showLogin()">
                    Login qiling
                </span>`;

            clearMessage();

            passwordInput.value = "";
        }


        // Login

        function login() {

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            clearMessage();

            if (email === "" || password === "") {

                message.textContent =
                    "⚠️ Iltimos, barcha maydonlarni to‘ldiring";

                message.style.color = "#ef4444";

                return;
            }


            if (!isValidEmail(email)) {

                message.textContent =
                    "⚠️ Email manzil noto‘g‘ri";

                message.style.color = "#ef4444";

                return;
            }


            if (password.length < 6) {

                message.textContent =
                    "⚠️ Parol kamida 6 ta belgidan iborat bo‘lsin";

                message.style.color = "#ef4444";

                return;
            }


            message.textContent =
                "✅ Login muvaffaqiyatli amalga oshirildi!";

            message.style.color = "#22c55e";
        }


        // Register

        function register() {

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            clearMessage();


            if (
                name === "" ||
                email === "" ||
                password === ""
            ) {

                message.textContent =
                    "⚠️ Iltimos, barcha maydonlarni to‘ldiring";

                message.style.color = "#ef4444";

                return;
            }


            if (name.length < 2) {

                message.textContent =
                    "⚠️ Ism kamida 2 ta belgidan iborat bo‘lsin";

                message.style.color = "#ef4444";

                return;
            }


            if (!isValidEmail(email)) {

                message.textContent =
                    "⚠️ Email manzil noto‘g‘ri";

                message.style.color = "#ef4444";

                return;
            }


            if (password.length < 6) {

                message.textContent =
                    "⚠️ Parol kamida 6 ta belgidan iborat bo‘lsin";

                message.style.color = "#ef4444";

                return;
            }


            message.textContent =
                "✅ Register muvaffaqiyatli amalga oshirildi!";

            message.style.color = "#22c55e";
        }


        // Email tekshirish

        function isValidEmail(email) {

            const emailRegex =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            return emailRegex.test(email);
        }


        // Parolni ko'rsatish / yashirish

        function togglePassword() {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                toggleBtn.textContent = "Yashir";

            } else {

                passwordInput.type = "password";

                toggleBtn.textContent = "Ko‘rsat";
            }
        }

    </script>

</body>

</html>
