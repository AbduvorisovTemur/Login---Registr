<!DOCTYPE html>
<html lang="uz">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NovaAuth — Login & Register</title>

  <meta
    name="description"
    content="Modern premium Login and Register authentication interface."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #050816;
      --card: rgba(15, 23, 42, 0.72);
      --card-border: rgba(255, 255, 255, 0.11);

      --text: #f8fafc;
      --muted: #94a3b8;
      --muted-2: #64748b;

      --primary: #8b5cf6;
      --primary-2: #6366f1;
      --cyan: #22d3ee;
      --pink: #ec4899;

      --success: #22c55e;
      --danger: #ef4444;

      --input: rgba(2, 6, 23, 0.58);

      --radius: 24px;
      --transition: 0.3s cubic-bezier(.16, 1, .3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      overflow-x: hidden;

      color: var(--text);
      font-family: "Inter", sans-serif;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(124, 58, 237, .24),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 85%,
          rgba(6, 182, 212, .18),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 10%,
          rgba(236, 72, 153, .13),
          transparent 25%
        ),
        var(--bg);
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .28;
    }

    .orb-1 {
      top: -220px;
      left: -150px;
      background: #7c3aed;
      animation: floatOne 12s ease-in-out infinite alternate;
    }

    .orb-2 {
      right: -180px;
      bottom: -200px;
      background: #06b6d4;
      animation: floatTwo 14s ease-in-out infinite alternate;
    }

    .orb-3 {
      right: 15%;
      top: -250px;
      width: 300px;
      height: 300px;
      background: #ec4899;
      opacity: .12;
      animation: floatThree 10s ease-in-out infinite alternate;
    }

    @keyframes floatOne {
      to {
        transform: translate(120px, 100px);
      }
    }

    @keyframes floatTwo {
      to {
        transform: translate(-100px, -90px);
      }
    }

    @keyframes floatThree {
      to {
        transform: translate(-70px, 130px);
      }
    }

    .grid {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.025) 1px,
          transparent 1px
        );

      background-size: 45px 45px;

      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 80%
      );
    }

    /* =========================
       CARD
    ========================= */

    .auth-wrapper {
      width: min(100%, 455px);
    }

    .auth-card {
      position: relative;

      width: 100%;

      padding: 42px;

      border: 1px solid var(--card-border);
      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.08),
          rgba(255,255,255,.025)
        );

      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);

      box-shadow:
        0 35px 100px rgba(0,0,0,.55),
        inset 0 1px 1px rgba(255,255,255,.1);

      overflow: hidden;

      animation: cardIn .7s cubic-bezier(.16,1,.3,1);
    }

    .auth-card::before {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          120deg,
          transparent 25%,
          rgba(255,255,255,.045),
          transparent 70%
        );

      transform: translateX(-100%);
      animation: shine 6s ease-in-out infinite;
    }

    @keyframes shine {
      0%, 60% {
        transform: translateX(-100%);
      }

      80%, 100% {
        transform: translateX(100%);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }

    .brand-icon {
      width: 54px;
      height: 54px;

      display: grid;
      place-items: center;

      border-radius: 17px;

      font-size: 22px;
      font-weight: 800;

      color: white;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #6366f1 50%,
          #06b6d4
        );

      box-shadow:
        0 12px 35px rgba(124,58,237,.38),
        inset 0 1px 1px rgba(255,255,255,.35);
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: clamp(30px, 7vw, 38px);
      line-height: 1.1;

      font-weight: 800;
      letter-spacing: -1.7px;

      background:
        linear-gradient(
          90deg,
          #c4b5fd,
          #67e8f9,
          #f9a8d4
        );

      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      margin-top: 10px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.6;
    }

    /* =========================
       FORM
    ========================= */

    .field {
      margin-bottom: 17px;
    }

    .field-label {
      display: flex;
      justify-content: space-between;

      margin-bottom: 8px;

      color: #cbd5e1;

      font-size: 12px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 17px;
      top: 50%;

      transform: translateY(-50%);

      width: 18px;

      color: var(--muted-2);

      transition: var(--transition);

      pointer-events: none;
    }

    input {
      width: 100%;
      height: 56px;

      padding: 0 17px 0 48px;

      outline: none;

      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;

      color: white;
      background: var(--input);

      font-family: inherit;
      font-size: 14px;

      transition:
        border-color var(--transition),
        box-shadow var(--transition),
        transform var(--transition),
        background var(--transition);
    }

    input::placeholder {
      color: #475569;
    }

    input:hover {
      border-color: rgba(167,139,250,.35);
    }

    input:focus {
      border-color: rgba(139,92,246,.85);

      background: rgba(2,6,23,.76);

      box-shadow:
        0 0 0 4px rgba(139,92,246,.11),
        0 12px 30px rgba(0,0,0,.18);

      transform: translateY(-1px);
    }

    input:focus + .input-icon {
      color: #a78bfa;
    }

    .password-input {
      padding-right: 82px;
    }

    /* =========================
       PASSWORD BUTTON
    ========================= */

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      height: 36px;
      padding: 0 10px;

      border: 0;
      border-radius: 10px;

      color: #a78bfa;
      background: rgba(139,92,246,.08);

      font-family: inherit;
      font-size: 11px;
      font-weight: 700;

      cursor: pointer;

      transition: var(--transition);
    }

    .password-toggle:hover {
      color: white;
      background: rgba(139,92,246,.2);
    }

    /* =========================
       PASSWORD STRENGTH
    ========================= */

    .strength {
      display: none;
      margin-top: 9px;
    }

    .strength.active {
      display: block;
    }

    .strength-bars {
      display: flex;
      gap: 5px;
    }

    .strength-bar {
      height: 4px;
      flex: 1;

      border-radius: 999px;

      background: rgba(255,255,255,.08);

      transition: .3s;
    }

    .strength-text {
      margin-top: 6px;

      color: var(--muted-2);

      font-size: 10px;
    }

    /* =========================
       BUTTON
    ========================= */

    .submit-btn {
      position: relative;

      width: 100%;
      height: 56px;

      margin-top: 5px;

      border: 0;
      border-radius: 16px;

      color: white;

      background:
        linear-gradient(
          110deg,
          #7c3aed,
          #6366f1,
          #06b6d4,
          #ec4899
        );

      background-size: 300% 100%;

      font-family: inherit;
      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 15px 38px rgba(124,58,237,.34);

      transition: var(--transition);

      animation: gradientMove 6s ease infinite;

      overflow: hidden;
    }

    .submit-btn::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          110deg,
          transparent,
          rgba(255,255,255,.18),
          transparent
        );

      transform: translateX(-100%);
      transition: .6s;
    }

    .submit-btn:hover::before {
      transform: translateX(100%);
    }

    .submit-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 20px 48px rgba(124,58,237,.46);
    }

    .submit-btn:active {
      transform: scale(.985);
    }

    .submit-btn.loading {
      pointer-events: none;
      opacity: .75;
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      min-height: 22px;

      margin-top: 13px;

      text-align: center;

      font-size: 12px;
      font-weight: 600;

      transition: .3s;
    }

    .message.error {
      color: #f87171;
      animation: shake .35s ease;
    }

    .message.success {
      color: #4ade80;
    }

    @keyframes shake {
      25% {
        transform: translateX(-5px);
      }

      50% {
        transform: translateX(5px);
      }

      75% {
        transform: translateX(-3px);
      }
    }

    /* =========================
       DIVIDER
    ========================= */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 20px 0;

      color: #475569;

      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;
      flex: 1;

      background: rgba(255,255,255,.08);
    }

    /* =========================
       SWITCH
    ========================= */

    .switch-text {
      text-align: center;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.6;
    }

    .switch-btn {
      border: 0;
      padding: 0;

      color: #a78bfa;
      background: transparent;

      font: inherit;
      font-weight: 700;

      cursor: pointer;

      transition: .25s;
    }

    .switch-btn:hover {
      color: #67e8f9;
    }

    /* =========================
       LOGGED IN
    ========================= */

    .profile {
      display: none;

      text-align: center;
    }

    .profile.active {
      display: block;
      animation: cardIn .5s ease;
    }

    .profile-avatar {
      width: 82px;
      height: 82px;

      margin: 0 auto 18px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      color: white;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #06b6d4
        );

      font-size: 27px;
      font-weight: 800;

      box-shadow:
        0 15px 45px rgba(124,58,237,.35);
    }

    .profile h2 {
      font-size: 22px;
      font-weight: 800;
    }

    .profile-email {
      margin-top: 7px;

      color: var(--muted);

      font-size: 12px;
    }

    .logout-btn {
      width: 100%;
      height: 52px;

      margin-top: 25px;

      border: 1px solid rgba(239,68,68,.2);
      border-radius: 15px;

      color: #fca5a5;
      background: rgba(239,68,68,.07);

      font-family: inherit;
      font-weight: 700;

      cursor: pointer;

      transition: .3s;
    }

    .logout-btn:hover {
      color: white;
      background: rgba(239,68,68,.15);
      border-color: rgba(239,68,68,.35);
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 22px;

      text-align: center;

      color: #475569;

      font-size: 10px;
    }

    .footer span {
      color: #64748b;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 520px) {
      body {
        padding: 15px;
      }

      .auth-card {
        padding: 30px 21px;
        border-radius: 25px;
      }

      .brand-icon {
        width: 50px;
        height: 50px;
      }

      .header {
        margin-bottom: 23px;
      }

      input,
      .submit-btn {
        height: 54px;
      }
    }

    @media (max-height: 700px) {
      .auth-card {
        padding-top: 25px;
        padding-bottom: 25px;
      }

      .brand {
        margin-bottom: 14px;
      }

      .header {
        margin-bottom: 18px;
      }

      .field {
        margin-bottom: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="auth-wrapper">

    <section class="auth-card">

      <!-- AUTH -->
      <div id="authView">

        <div class="brand">
          <div class="brand-icon">N</div>
        </div>

        <div class="header">
          <h1 id="title">Create account</h1>

          <p id="description">
            Yangi hisob yarating va boshlang.
          </p>
        </div>

        <form id="authForm" novalidate>

          <!-- NAME -->
          <div class="field" id="nameField">

            <div class="field-label">
              <label for="name">To‘liq ism</label>
            </div>

            <div class="input-wrapper">

              <input
                type="text"
                id="name"
                placeholder="Masalan, Temur Abduvorisov"
                autocomplete="name"
              >

              <svg class="input-icon" viewBox="0 0 24 24" fill="none">
                <path
                  d="M20 21a8 8 0 0 0-16 0M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>

            </div>
          </div>

          <!-- EMAIL -->
          <div class="field">

            <div class="field-label">
              <label for="email">Email</label>
            </div>

            <div class="input-wrapper">

              <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
              >

              <svg class="input-icon" viewBox="0 0 24 24" fill="none">
                <path
                  d="M4 6h16v12H4z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
                <path
                  d="m4 7 8 6 8-6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

            </div>
          </div>

          <!-- PASSWORD -->
          <div class="field">

            <div class="field-label">
              <label for="password">Parol</label>
            </div>

            <div class="input-wrapper">

              <input
                type="password"
                id="password"
                class="password-input"
                placeholder="Kamida 6 ta belgi"
                autocomplete="new-password"
              >

              <svg class="input-icon" viewBox="0 0 24 24" fill="none">
                <rect
                  x="4"
                  y="10"
                  width="16"
                  height="10"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M8 10V7a4 4 0 0 1 8 0v3"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>

              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
              >
                Ko‘rsat
              </button>

            </div>

            <div class="strength" id="strength">

              <div class="strength-bars">
                <span class="strength-bar"></span>
                <span class="strength-bar"></span>
                <span class="strength-bar"></span>
                <span class="strength-bar"></span>
              </div>

              <p class="strength-text" id="strengthText">
                Parol kuchi
              </p>

            </div>

          </div>

          <button
            type="submit"
            class="submit-btn"
            id="submitButton"
          >
            <span id="buttonText">Create account</span>
          </button>

        </form>

        <div
          class="message"
          id="message"
          aria-live="polite"
        ></div>

        <div class="divider">
          <span>yoki</span>
        </div>

        <p class="switch-text" id="switchText">
          Hisobingiz allaqachon bormi?
          <button
            type="button"
            class="switch-btn"
            id="switchButton"
          >
            Login qiling
          </button>
        </p>

        <div class="footer">
          Secure demo authentication • <span>NovaAuth</span>
        </div>

      </div>

      <!-- PROFILE -->
      <div class="profile" id="profileView">

        <div class="profile-avatar" id="profileAvatar">
          T
        </div>

        <h2 id="profileName">
          Xush kelibsiz!
        </h2>

        <p
          class="profile-email"
          id="profileEmail"
        >
          email@example.com
        </p>

        <button
          type="button"
          class="logout-btn"
          id="logoutButton"
        >
          Logout
        </button>

        <div class="footer">
          NovaAuth • Demo account
        </div>

      </div>

    </section>

  </main>

  <script>
    /* ==========================================
       ELEMENTS
    ========================================== */

    const authForm = document.getElementById("authForm");

    const authView = document.getElementById("authView");
    const profileView = document.getElementById("profileView");

    const title = document.getElementById("title");
    const description = document.getElementById("description");

    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("name");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const strength =
      document.getElementById("strength");

    const strengthBars =
      document.querySelectorAll(".strength-bar");

    const strengthText =
      document.getElementById("strengthText");

    const submitButton =
      document.getElementById("submitButton");

    const buttonText =
      document.getElementById("buttonText");

    const message =
      document.getElementById("message");

    const switchText =
      document.getElementById("switchText");

    const switchButton =
      document.getElementById("switchButton");

    const profileAvatar =
      document.getElementById("profileAvatar");

    const profileName =
      document.getElementById("profileName");

    const profileEmail =
      document.getElementById("profileEmail");

    const logoutButton =
      document.getElementById("logoutButton");


    /* ==========================================
       STATE
    ========================================== */

    let mode = "register";


    /* ==========================================
       HELPERS
    ========================================== */

    function getAccount() {
      const account =
        localStorage.getItem("novaAuthAccount");

      return account
        ? JSON.parse(account)
        : null;
    }


    function setAccount(account) {
      localStorage.setItem(
        "novaAuthAccount",
        JSON.stringify(account)
      );
    }


    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }


    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message ${type}`;
    }


    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }


    function getInitials(name) {
      return name
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(word => word[0])
        .join("")
        .toUpperCase();
    }


    function setLoading(loading) {
      submitButton.classList.toggle(
        "loading",
        loading
      );

      submitButton.disabled = loading;

      buttonText.textContent =
        loading
          ? "Tekshirilmoqda..."
          : mode === "register"
            ? "Create account"
            : "Login";
    }


    /* ==========================================
       MODE
    ========================================== */

    function setMode(newMode) {

      mode = newMode;

      clearMessage();

      passwordInput.value = "";

      passwordInput.type = "password";

      passwordToggle.textContent = "Ko‘rsat";

      updatePasswordStrength();

      if (mode === "register") {

        title.textContent = "Create account";

        description.textContent =
          "Yangi hisob yarating va boshlang.";

        nameField.style.display = "block";

        nameInput.required = true;

        buttonText.textContent =
          "Create account";

        switchText.innerHTML = `
          Hisobingiz allaqachon bormi?
          <button
            type="button"
            class="switch-btn"
            id="switchButton"
          >
            Login qiling
          </button>
        `;

      } else {

        title.textContent = "Welcome back";

        description.textContent =
          "Hisobingizga kirish uchun davom eting.";

        nameField.style.display = "none";

        nameInput.required = false;

        buttonText.textContent = "Login";

        switchText.innerHTML = `
          Hisobingiz yo‘qmi?
          <button
            type="button"
            class="switch-btn"
            id="switchButton"
          >
            Hisob yarating
          </button>
        `;
      }

      document
        .getElementById("switchButton")
        .addEventListener("click", () => {
          setMode(
            mode === "register"
              ? "login"
              : "register"
          );
        });
    }


    /* ==========================================
       PASSWORD TOGGLE
    ========================================== */

    passwordToggle.addEventListener(
      "click",
      () => {

        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword
            ? "text"
            : "password";

        passwordToggle.textContent =
          isPassword
            ? "Yashir"
            : "Ko‘rsat";
      }
    );


    /* ==========================================
       PASSWORD STRENGTH
    ========================================== */

    function getPasswordStrength(password) {

      let score = 0;

      if (password.length >= 6) score++;
      if (password.length >= 8) score++;
      if (/[A-Z]/.test(password)) score++;
      if (/[0-9]/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;

      return Math.min(score, 4);
    }


    function updatePasswordStrength() {

      if (mode !== "register") {
        strength.classList.remove("active");
        return;
      }

      const password =
        passwordInput.value;

      if (!password) {
        strength.classList.remove("active");
        return;
      }

      strength.classList.add("active");

      const score =
        getPasswordStrength(password);

      const colors = [
        "#ef4444",
        "#f97316",
        "#eab308",
        "#22c55e"
      ];

      const labels = [
        "Juda zaif",
        "Zaif",
        "Yaxshi",
        "Kuchli"
      ];

      strengthBars.forEach(
        (bar, index) => {

          bar.style.background =
            index < score
              ? colors[Math.max(score - 1, 0)]
              : "rgba(255,255,255,.08)";
        }
      );

      strengthText.textContent =
        labels[Math.max(score - 1, 0)] ||
        "Parol kuchi";

      strengthText.style.color =
        colors[Math.max(score - 1, 0)] ||
        "#64748b";
    }


    passwordInput.addEventListener(
      "input",
      updatePasswordStrength
    );


    /* ==========================================
       REGISTER
    ========================================== */

    function register() {

      const name =
        nameInput.value.trim();

      const email =
        emailInput.value.trim().toLowerCase();

      const password =
        passwordInput.value;

      clearMessage();

      if (!name || !email || !password) {
        showMessage(
          "⚠️ Iltimos, barcha maydonlarni to‘ldiring."
        );
        return;
      }

      if (name.length < 2) {
        showMessage(
          "⚠️ Ism kamida 2 ta belgidan iborat bo‘lsin."
        );
        return;
      }

      if (!isValidEmail(email)) {
        showMessage(
          "⚠️ Email manzil noto‘g‘ri."
        );
        return;
      }

      if (password.length < 6) {
        showMessage(
          "⚠️ Parol kamida 6 ta belgidan iborat bo‘lsin."
        );
        return;
      }

      const existingAccount =
        getAccount();

      if (
        existingAccount &&
        existingAccount.email === email
      ) {
        showMessage(
          "⚠️ Bu email bilan account allaqachon mavjud."
        );
        return;
      }

      setLoading(true);

      setTimeout(() => {

        const account = {
          name,
          email,
          password
        };

        setAccount(account);

        setLoading(false);

        showMessage(
          "✓ Account muvaffaqiyatli yaratildi!",
          "success"
        );

        setTimeout(() => {

          emailInput.value = email;
          passwordInput.value = "";

          setMode("login");

          showMessage(
            "✓ Endi accountingizga kiring.",
            "success"
          );

        }, 900);

      }, 700);
    }


    /* ==========================================
       LOGIN
    ========================================== */

    function login() {

      const email =
        emailInput.value.trim().toLowerCase();

      const password =
        passwordInput.value;

      clearMessage();

      if (!email || !password) {
        showMessage(
          "⚠️ Email va parolni kiriting."
        );
        return;
      }

      if (!isValidEmail(email)) {
        showMessage(
          "⚠️ Email manzil noto‘g‘ri."
        );
        return;
      }

      const account =
        getAccount();

      if (!account) {
        showMessage(
          "⚠️ Account topilmadi. Avval register qiling."
        );
        return;
      }

      if (
        account.email !== email ||
        account.password !== password
      ) {
        showMessage(
          "⚠️ Email yoki parol noto‘g‘ri."
        );
        return;
      }

      setLoading(true);

      setTimeout(() => {

        setLoading(false);

        showProfile(account);

      }, 700);
    }


    /* ==========================================
       FORM SUBMIT
    ========================================== */

    authForm.addEventListener(
      "submit",
      event => {

        event.preventDefault();

        if (mode === "register") {
          register();
        } else {
          login();
        }
      }
    );


    /* ==========================================
       PROFILE
    ========================================== */

    function showProfile(account) {

      authView.style.display = "none";

      profileView.classList.add("active");

      profileName.textContent =
        `Xush kelibsiz, ${account.name}!`;

      profileEmail.textContent =
        account.email;

      profileAvatar.textContent =
        getInitials(account.name);
    }


    /* ==========================================
       LOGOUT
    ========================================== */

    logoutButton.addEventListener(
      "click",
      () => {

        profileView.classList.remove("active");

        authView.style.display = "block";

        emailInput.value = "";
        passwordInput.value = "";

        setMode("login");

        showMessage(
          "✓ Accountdan chiqdingiz.",
          "success"
        );
      }
    );


    /* ==========================================
       ENTER KEY UX
    ========================================== */

    [
      nameInput,
      emailInput,
      passwordInput
    ].forEach(input => {

      input.addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter" &&
            input !== passwordInput
          ) {
            event.preventDefault();

            const fields =
              mode === "register"
                ? [nameInput, emailInput, passwordInput]
                : [emailInput, passwordInput];

            const currentIndex =
              fields.indexOf(input);

            const next =
              fields[currentIndex + 1];

            if (next) {
              next.focus();
            }
          }
        }
      );
    });


    /* ==========================================
       INITIAL STATE
    ========================================== */

    setMode("register");
  </script>

</body>
</html>
